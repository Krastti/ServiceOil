# Docker DNS updates the upstream address when Compose replaces the app container.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream serviceoil {
    zone serviceoil 64k;
    server app:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep authentication, authorization and CSRF checks inside Spring Security.
    location ~ ^/(api(?:/|$)|admin(?:/|$)|login$|logout$) {
        proxy_pass http://serviceoil;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the only HTTP entry point: replace client-supplied forwarding data.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
