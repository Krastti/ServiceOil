x-runtime: &runtime
  image: serviceoil:local
  build:
    context: .
    target: runtime
  environment: &database
    SERVICEOIL_DB_URL: jdbc:postgresql://db:5432/serviceoil
    SERVICEOIL_DB_USER: serviceoil
    SERVICEOIL_DB_PASSWORD: ${SERVICEOIL_DB_PASSWORD:-serviceoil_local}

services:
  db:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: serviceoil
      POSTGRES_USER: serviceoil
      POSTGRES_PASSWORD: ${SERVICEOIL_DB_PASSWORD:-serviceoil_local}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - serviceoil_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serviceoil -d serviceoil']
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database
      SERVER_ADDRESS: 0.0.0.0
      ROSSTAT_WEEKLY_INDEX_URL: ${ROSSTAT_WEEKLY_INDEX_URL:-https://rosstat.gov.ru/compendium/document/50798}
      ROSSTAT_WEEKLY_SCHEDULE_ENABLED: ${ROSSTAT_WEEKLY_SCHEDULE_ENABLED:-false}
      ROSSTAT_WEEKLY_CRON: ${ROSSTAT_WEEKLY_CRON:-0 0 10 * * THU}
      ROSSTAT_WEEKLY_ZONE: ${ROSSTAT_WEEKLY_ZONE:-Europe/Moscow}
      ROSSTAT_WEEKLY_LOOKBACK_DAYS: ${ROSSTAT_WEEKLY_LOOKBACK_DAYS:-14}
    ports:
      - '127.0.0.1:${SERVICEOIL_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
volumes:
  serviceoil_pg:
