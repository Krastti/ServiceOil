# suppress inspection "UnusedProperty" for whole file
spring.application.name=ServiceOil
rosstat.weekly.index-url=${ROSSTAT_WEEKLY_INDEX_URL:https://rosstat.gov.ru/compendium/document/50798}
rosstat.weekly.schedule.enabled=${ROSSTAT_WEEKLY_SCHEDULE_ENABLED:false}
rosstat.weekly.schedule.cron=${ROSSTAT_WEEKLY_CRON:0 0 10 * * THU}
rosstat.weekly.schedule.zone=${ROSSTAT_WEEKLY_ZONE:Europe/Moscow}
rosstat.weekly.lookback-days=${ROSSTAT_WEEKLY_LOOKBACK_DAYS:14}

spring.datasource.url=${SERVICEOIL_DB_URL:jdbc:postgresql://localhost:55432/serviceoil}
spring.datasource.username=${SERVICEOIL_DB_USER:serviceoil}
spring.datasource.password=${SERVICEOIL_DB_PASSWORD:serviceoil_local}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.address=127.0.0.1

server.error.include-message=never

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.web.resources.cache.cachecontrol.no-store=true
server.servlet.session.cookie.same-site=lax
