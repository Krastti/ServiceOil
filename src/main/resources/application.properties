# suppress inspection "UnusedProperty" for whole file
spring.application.name=ServiceOil

logging.level.root=INFO
logging.level.ru.krastti.logging=INFO
logging.level.org.springframework.cache.interceptor=${SERVICEOIL_CACHE_LOG_LEVEL:INFO}
logging.console.enabled=true
spring.main.log-startup-info=true
logging.file.name=${LOGGING_FILE_NAME:logs/serviceoil.log}
logging.logback.rollingpolicy.file-name-pattern=${LOGGING_FILE_NAME:logs/serviceoil.log}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=${LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true

serviceoil.logging.slow-read-threshold-ms=${SERVICEOIL_SLOW_READ_THRESHOLD_MS:500}
serviceoil.cache.vehicle-templates-ttl-seconds=${SERVICEOIL_VEHICLE_TEMPLATES_CACHE_TTL_SECONDS:300}

rosstat.weekly.index-url=${ROSSTAT_WEEKLY_INDEX_URL:https://rosstat.gov.ru/compendium/document/50798}
rosstat.weekly.schedule.enabled=${ROSSTAT_WEEKLY_SCHEDULE_ENABLED:false}
rosstat.weekly.schedule.cron=${ROSSTAT_WEEKLY_CRON:0 0 10 * * THU}
rosstat.weekly.schedule.zone=${ROSSTAT_WEEKLY_ZONE:Europe/Moscow}
rosstat.weekly.lookback-days=${ROSSTAT_WEEKLY_LOOKBACK_DAYS:14}

spring.datasource.url=${SERVICEOIL_DB_URL:jdbc:postgresql://localhost:55432/serviceoil}
spring.datasource.username=${SERVICEOIL_DB_USER:serviceoil}
spring.datasource.password=${SERVICEOIL_DB_PASSWORD:serviceoil_local}

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.address=127.0.0.1

server.error.include-message=never

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.web.resources.cache.cachecontrol.no-store=true
server.servlet.session.cookie.same-site=lax
